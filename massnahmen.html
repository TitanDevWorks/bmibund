<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maßnahmenplan · Bundesministerium für Inneres und Heimat</title>
  <meta name="description" content="Alle Maßnahmen der ersten 100 Tage mit Phase, Zuständigkeit, Frist und aktuellem Stand.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="massnahmen">
  <main id="main">
    <section class="page-head">
      <div class="container">
        <span class="kicker">Die ersten 100 Tage</span>
        <h1>Maßnahmenplan</h1>
        <p>Jede Maßnahme mit Phase, Zuständigkeit und Grundlage im Koalitionsvertrag. Der Stand wird von der Hausleitung laufend gepflegt.</p>
      </div>
    </section>
    <section class="section" style="padding-top:32px">
      <div class="container">
        <form class="filters" id="filters" role="search">
          <label class="field grow">Suche <input id="q" type="search" placeholder="Titel, Bereich oder Beschreibung" autocomplete="off"></label>
          <label class="field">Phase <select id="f-phase"><option value="">Alle Phasen</option></select></label>
          <label class="field">Status <select id="f-status"><option value="">Alle Status</option></select></label>
          <label class="field">Bereich <select id="f-bereich"><option value="">Alle Bereiche</option></select></label>
          <div class="seg" role="group" aria-label="Ansicht">
            <button type="button" data-view="liste" aria-pressed="true">Liste</button>
            <button type="button" data-view="board" aria-pressed="false">Board</button>
            <button type="button" data-view="phasen" aria-pressed="false">Phasen</button>
          </div>
        </form>
        <p class="result-info" id="info" aria-live="polite"></p>
        <div id="plan"></div>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/pages.js"></script>
</body>
</html>
