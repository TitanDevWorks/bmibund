<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verwaltung · BMIH</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d1420">
  <link rel="icon" href="assets/emblem.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body data-page="admin">
  <main id="main" class="container admin">
    <section class="login" id="login-view" hidden>
      <div class="login-card">
        <img src="assets/emblem.svg" alt="" width="44" height="52">
        <span class="kicker">Hausleitung</span>
        <h1 class="display">Verwaltung</h1>
        <form id="login" class="login-form">
          <label class="field">Benutzername <input name="username" autocomplete="username" required maxlength="64"></label>
          <label class="field">Passwort <input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
          <button class="btn btn-gold" type="submit">Anmelden</button>
          <p class="msg" id="login-msg" role="alert"></p>
        </form>
      </div>
    </section>

    <section id="app" hidden>
      <div class="admin-head">
        <div>
          <span class="kicker">Hausleitung</span>
          <h1 class="display">Verwaltung</h1>
        </div>
        <div class="admin-user"><span id="who"></span><button class="btn" id="logout" type="button">Abmelden</button></div>
      </div>

      <div class="seg tabs" role="group" aria-label="Bereiche">
        <button type="button" data-tab="massnahmen" aria-pressed="true">Maßnahmen</button>
        <button type="button" data-tab="presse" aria-pressed="false">Presse</button>
        <button type="button" data-tab="postfach" aria-pressed="false">Postfach <b id="inbox-count"></b></button>
      </div>
      <p class="msg" id="msg" role="status"></p>

      <div class="tab" data-panel="massnahmen">
        <div class="panel"><div id="m-list"></div></div>
        <form class="panel form" id="m-new">
          <h3 class="full">Neue Maßnahme</h3>
          <label class="field full">Titel <input name="titel" required maxlength="200"></label>
          <label class="field">Phase <select name="phase"></select></label>
          <label class="field">Status <select name="status"></select></label>
          <label class="field">Bereich <input name="bereich" maxlength="80"></label>
          <label class="field">Grundlage <input name="grundlage" maxlength="120" placeholder="Koalitionsvertrag Art. …"></label>
          <label class="field full">Beschreibung <textarea name="beschreibung" rows="3" maxlength="1000"></textarea></label>
          <div class="full"><button class="btn btn-gold" type="submit">Anlegen</button></div>
        </form>
      </div>

      <div class="tab" data-panel="presse" hidden>
        <form class="panel form" id="n-new">
          <h3 class="full">Neue Pressemitteilung</h3>
          <label class="field full">Titel <input name="titel" required maxlength="200"></label>
          <label class="field">Datum <input name="datum" type="date" required></label>
          <label class="field full">Text <textarea name="text" rows="5" required maxlength="4000"></textarea></label>
          <div class="full"><button class="btn btn-gold" type="submit">Veröffentlichen</button></div>
        </form>
        <div class="panel"><div id="n-list"></div></div>
      </div>

      <div class="tab" data-panel="postfach" hidden>
        <div class="panel"><div id="inbox"></div></div>
      </div>
    </section>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
